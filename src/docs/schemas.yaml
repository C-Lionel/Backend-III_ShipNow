
components:
  schemas:

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Recurso no encontrado
        code:
          type: string
          example: ROUTE_NOT_FOUND

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        payload:
          description: Datos devueltos por la operación

    User:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
          example: "671a2b3c4d5e6f7890123456"
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: juan@example.com
        role:
          type: string
          enum: [admin, customer, driver, store]
          default: customer
          example: customer
        documents:
          type: array
          default: []
          items:
            type: object
            properties:
              name:
                type: string
                example: DNI
              reference:
                type: string
                example: documento.pdf
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    UserCreate:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Pérez
        email:
          type: string
          format: email
          example: juan@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: password123
        role:
          type: string
          enum: [customer]
          default: customer
          description: El registro público solamente permite crear clientes.
          example: customer

    OrderItem:
      type: object
      required:
        - name
        - quantity
        - price
      properties:
        name:
          type: string
          example: Paquete mediano
        quantity:
          type: number
          minimum: 1
          example: 2
        price:
          type: number
          minimum: 0
          example: 1500

    Order:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
          example: "671a2b3c4d5e6f7890123457"
        customer:
          type: string
          description: ID del cliente
          example: "671a2b3c4d5e6f7890123456"
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        deliveryAddress:
          type: string
          example: Av. Siempre Viva 742
        total:
          type: number
          example: 3010
        shippingCost:
          type: number
          example: 10
        declaredValue:
          type: number
          example: 3000
        status:
          type: string
          enum:
            - created
            - assigned
            - picked_up
            - in_transit
            - delivered
            - cancelled
          default: created
          example: created
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: normal
        delivery:
          type: string
          nullable: true
          description: ID de la entrega asociada
          example: null
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Delivery:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
          example: "671a2b3c4d5e6f7890123458"
        order:
          type: string
          description: ID del pedido
          example: "671a2b3c4d5e6f7890123457"
        driver:
          type: string
          nullable: true
          description: ID del repartidor
          example: null
        status:
          type: string
          enum: [pending, assigned, in_transit, delivered]
          default: pending
          example: pending
        priority:
          type: string
          enum: [low, normal, high]
          default: normal
          example: normal
        assignedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
