
paths:
  /api/logger-test:
    get:
      tags: [Logger]
      summary: Probar los niveles de logging
      description: >
        Ejecuta una prueba de los seis niveles de logging
        configurados con Winston: debug, http, info, warning,
        error y fatal.

        Este endpoint solamente está disponible cuando
        NODE_ENV=development. En otros entornos, la ruta
        no está registrada y responde con ROUTE_NOT_FOUND.

        Los mensajes se generan en el servidor y pueden
        observarse en la terminal. Los niveles error y fatal
        también se registran en los archivos de errores
        configurados por Winston.
      responses:
        "200":
          description: Prueba de logging ejecutada correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        example: Prueba de logging ejecutada correctamente
        "404":
          description: >
            Endpoint no disponible fuera del entorno de desarrollo
            (ROUTE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
